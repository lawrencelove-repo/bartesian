<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // One-time purge: port 8099 may still be controlled by a sibling app's
      // service worker (recipes), which cache-serves its JS/CSS as "Recipes".
      (function () {
        if (!("serviceWorker" in navigator)) return;
        var flag = "bartesian-sw-migrated";
        try {
          if (localStorage.getItem(flag) === "v5") return;
        } catch (_) {}
        window.__bartesianPurging = true;
        document.documentElement.style.visibility = "hidden";
        navigator.serviceWorker
          .getRegistrations()
          .then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          })
          .then(function () {
            return caches.keys();
          })
          .then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          })
          .then(function () {
            try {
              localStorage.setItem(flag, "v5");
            } catch (_) {}
            location.reload();
          })
          .catch(function () {
            document.documentElement.style.visibility = "";
          });
      })();
    </script>
